/* ===== Tokens — AL21 brand: nero + rosso bordeaux ===== */
:root{
  --ink:#141210;
  --paper:#FAF7F2;
  --surface:#FFFFFF;
  --surface-2:#F4EEE4;
  --text:#18140F;
  --text-muted:#5C5449;
  --text-faint:#8B8175;
  --border:rgba(20,18,14,0.12);
  --border-strong:rgba(20,18,14,0.22);
  --accent:#8A241E;
  --accent-ink:#FFFFFF;
  --brick:#8A241E;
  --brick-soft:#F5E1DD;
  --olive:#4B5C3E;
  --shadow:0 20px 40px -24px rgba(20,18,14,0.22);
  --focus:0 0 0 3px rgba(138,36,30,0.35);
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#1E1A17;
    --surface-2:#282320;
    --text:#F5F0E8;
    --text-muted:#B9B0A3;
    --text-faint:#83786C;
    --border:rgba(245,240,232,0.14);
    --border-strong:rgba(245,240,232,0.24);
    --accent:#D3564A;
    --accent-ink:#1A0B09;
    --brick:#D3564A;
    --brick-soft:#3A211D;
    --olive:#8FA37C;
    --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    --focus:0 0 0 3px rgba(211,86,74,0.45);
    color-scheme:dark;
  }
}
:root[data-theme="light"]{
  --surface:#FFFFFF; --surface-2:#F4EEE4;
  --text:#18140F; --text-muted:#5C5449; --text-faint:#8B8175;
  --border:rgba(20,18,14,0.12); --border-strong:rgba(20,18,14,0.22);
  --accent:#8A241E; --accent-ink:#FFFFFF; --brick:#8A241E; --brick-soft:#F5E1DD;
  --olive:#4B5C3E;
  --shadow:0 20px 40px -24px rgba(20,18,14,0.22); --focus:0 0 0 3px rgba(138,36,30,0.35);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#1E1A17; --surface-2:#282320;
  --text:#F5F0E8; --text-muted:#B9B0A3; --text-faint:#83786C;
  --border:rgba(245,240,232,0.14); --border-strong:rgba(245,240,232,0.24);
  --accent:#D3564A; --accent-ink:#1A0B09; --brick:#D3564A; --brick-soft:#3A211D;
  --olive:#8FA37C;
  --shadow:0 20px 50px -20px rgba(0,0,0,0.6); --focus:0 0 0 3px rgba(211,86,74,0.45);
  color-scheme:dark;
}

/* ===== Reset & base ===== */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
@media (prefers-color-scheme: dark){ body{ background:var(--ink); } }
:root[data-theme="dark"] body{ background:var(--ink); }
:root[data-theme="light"] body{ background:var(--paper); }

body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:0.035; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

h1,h2,h3{ margin:0; font-family:'Fraunces',Georgia,serif; text-wrap:balance; }
p{ margin:0; }
button{ font-family:inherit; }
img,svg{ display:block; }
a{ color:inherit; }
::selection{ background:var(--accent); color:var(--accent-ink); }

.icon{ width:1em; height:1em; flex:none; }

/* ===== Layout shell ===== */
.app{ position:relative; z-index:1; max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

/* ===== Header ===== */
.hdr{
  position:sticky; top:0; z-index:30;
  background:var(--paper); border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;
  display:flex; flex-direction:column; gap:14px;
}
@media (prefers-color-scheme: dark){ .hdr{ background:var(--ink); } }
:root[data-theme="dark"] .hdr{ background:var(--ink); }
:root[data-theme="light"] .hdr{ background:var(--paper); }

.hdr-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.brand{ display:flex; flex-direction:column; gap:2px; }
.brand-mark{ font-size:1.9rem; font-weight:900; letter-spacing:0.01em; line-height:1; color:var(--text); }
.brand-tag{ font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:500; font-size:0.86rem; color:var(--accent); }

.langbar{ display:flex; gap:6px; flex-wrap:wrap; }
.lang-btn{
  border:1px solid var(--border-strong); background:transparent; color:var(--text-muted);
  border-radius:999px; padding:6px 11px; font-size:0.72rem; font-weight:700; letter-spacing:0.06em;
  cursor:pointer; transition:background .15s,color .15s,border-color .15s;
}
.lang-btn:hover{ border-color:var(--accent); color:var(--text); }
.lang-btn[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.lang-btn:focus-visible{ outline:none; box-shadow:var(--focus); }

.searchwrap{ position:relative; }
.search{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-m); padding:12px 14px 12px 42px; font-size:0.95rem; font-family:inherit;
}
.search::placeholder{ color:var(--text-faint); }
.search:focus{ outline:none; border-color:var(--accent); box-shadow:var(--focus); }
.searchwrap .icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-faint); width:18px; height:18px; }
.search-clear{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text-faint); cursor:pointer; padding:6px; border-radius:50%;
  display:none;
}
.search-clear.show{ display:flex; }
.search-clear:hover{ color:var(--text); background:var(--surface-2); }

.filterbtn-row{ display:flex; align-items:center; gap:10px; }
.filterbtn{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); border-radius:999px; padding:9px 14px 9px 12px; font-size:0.82rem; font-weight:700;
  cursor:pointer; transition:border-color .15s;
}
.filterbtn .icon{ width:16px; height:16px; color:var(--accent); }
.filterbtn:hover{ border-color:var(--border-strong); }
.filterbtn:focus-visible{ outline:none; box-shadow:var(--focus); }
.filter-count{
  background:var(--brick); color:#fff; border-radius:999px; font-size:0.68rem; font-weight:800;
  min-width:18px; height:18px; display:none; align-items:center; justify-content:center; padding:0 5px;
}
.filter-count.show{ display:inline-flex; }
.results-meta{ font-size:0.76rem; color:var(--text-faint); letter-spacing:0.02em; }

/* ===== Main content ===== */
.main{ flex:1; padding:8px 20px 40px; }
.section{ margin-top:14px; }
.section:first-child{ margin-top:0; }
.section-head{
  width:100%; display:flex; align-items:baseline; gap:10px; padding:14px 2px; margin-bottom:0;
  border-bottom:1px solid var(--border); background:none; border-left:none; border-right:none; border-top:none;
  cursor:pointer; text-align:left; color:inherit; font-family:inherit;
}
.section-head:focus-visible{ outline:none; box-shadow:var(--focus); border-radius:var(--radius-s); }
.section-title{ font-size:1.3rem; font-weight:600; font-style:italic; color:var(--text); }
.section-count{ font-size:0.72rem; color:var(--text-faint); font-weight:700; letter-spacing:0.04em; }
.section-chevron{ width:20px; height:20px; color:var(--text-faint); transition:transform .2s; flex:none; margin-left:auto; }
.section[data-open="true"] .section-chevron{ transform:rotate(180deg); }
.section-note{ font-size:0.78rem; color:var(--accent); font-weight:700; margin:14px 0 12px; }

.section-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; }
.section[data-open="true"] .section-body{ grid-template-rows:1fr; }
.section-body-inner{ overflow:hidden; }

.dishlist{ display:flex; flex-direction:column; gap:8px; padding-top:14px; }
.section-note + .dishlist{ padding-top:0; }
.dish{
  border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface);
  overflow:hidden; transition:border-color .15s;
}
.dish[data-flagged="true"]{ border-color:var(--brick); }
.dish-row{
  width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px; background:none; border:none;
  color:inherit; text-align:left; cursor:pointer;
}
.dish-row:focus-visible{ outline:none; box-shadow:var(--focus); border-radius:var(--radius-m); }
.dish-title{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
.dish-name{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.02rem; }
.dish-price{ font-size:0.76rem; font-weight:700; color:var(--accent); letter-spacing:0.01em; }
.dish-chips{ display:flex; gap:5px; flex-wrap:wrap; }
.dish-chip-icon{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--text-muted); flex:none;
}
.dish-chip-icon.warn{ background:var(--brick-soft); color:var(--brick); }
.dish-chip-icon .icon{ width:14px; height:14px; }
.dish-gf{
  font-size:0.62rem; font-weight:800; letter-spacing:0.05em; color:var(--olive); border:1px solid var(--olive);
  border-radius:999px; padding:3px 7px; flex:none;
}
.dish-chevron{ width:18px; height:18px; color:var(--text-faint); transition:transform .2s; flex:none; }
.dish[data-open="true"] .dish-chevron{ transform:rotate(180deg); }

.dish-warnline{
  display:flex; align-items:center; gap:6px; padding:0 14px 11px; margin-top:-6px;
  font-size:0.74rem; color:var(--brick); font-weight:700;
}
.dish-warnline .icon{ width:13px; height:13px; }
.dish-warnline.trace{ color:var(--text-muted); font-weight:600; font-style:italic; }
.dish-warnline.trace .icon{ color:var(--accent); }

.dish-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; }
.dish[data-open="true"] .dish-body{ grid-template-rows:1fr; }
.dish-body-inner{ overflow:hidden; }
.dish-detail{ padding:2px 14px 16px; border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:10px; }
.dish-photo{ width:100%; overflow:hidden; background:var(--surface-2); line-height:0; }
.dish-photo img{ width:100%; height:auto; aspect-ratio:16/10; object-fit:cover; display:block; }
.detail-block label{ display:block; font-size:0.66rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; }
.detail-block p{ font-size:0.88rem; color:var(--text); line-height:1.55; }
.detail-block.allergens p{ color:var(--brick); font-weight:700; }
.detail-block.traces p, .detail-block.cross p{ color:var(--text-muted); font-style:italic; }

@media (prefers-reduced-motion: reduce){ .dish-body,.dish-chevron,.lang-btn,.dish,.section-body,.section-chevron{ transition:none !important; } }

.empty{ text-align:center; padding:50px 20px; color:var(--text-muted); }
.empty .icon{ width:34px; height:34px; margin:0 auto 12px; color:var(--text-faint); }
.empty p{ font-size:0.92rem; max-width:34ch; margin:0 auto; }

.hidden-note{ font-size:0.72rem; color:var(--text-faint); padding:8px 4px 0; font-style:italic; }

/* ===== Drinks list ===== */
.drinks-list{ display:flex; flex-direction:column; gap:10px; }
.drink-cat{ border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); overflow:hidden; }
.drinks-category{
  width:100%; display:flex; align-items:baseline; gap:10px; padding:12px 14px; background:none; border:none;
  cursor:pointer; text-align:left; color:inherit; font-family:inherit;
}
.drinks-category:focus-visible{ outline:none; box-shadow:var(--focus); }
.drinks-category-name{
  font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600; font-size:1rem; color:var(--accent);
}
.drinks-category-count{ font-size:0.68rem; color:var(--text-faint); font-weight:700; letter-spacing:0.04em; }
.drinks-category-chevron{ width:16px; height:16px; color:var(--text-faint); transition:transform .2s; flex:none; margin-left:auto; }
.drink-cat[data-open="true"] .drinks-category-chevron{ transform:rotate(180deg); }

.drink-cat-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; }
.drink-cat[data-open="true"] .drink-cat-body{ grid-template-rows:1fr; }
.drink-cat-body-inner{ overflow:hidden; padding:0 14px; }

.drink-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:9px 0; border-top:1px dashed var(--border);
}
.drink-cat-body-inner .drink-row:first-child{ border-top:1px solid var(--border); }
.drink-name{ font-size:0.9rem; color:var(--text); }
.drink-price{ font-size:0.86rem; font-weight:700; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.drink-price-group{ display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
.drink-price-item{ font-size:0.86rem; font-weight:700; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.drink-price-label{ font-size:0.68rem; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.03em; margin-right:4px; }

@media (prefers-reduced-motion: reduce){ .drink-cat-body,.drinks-category-chevron{ transition:none !important; } }

/* ===== Pizza base carousel ===== */
.pizza-carousel-wrap{ display:flex; flex-direction:column; gap:14px; }
.pizza-carousel{
  display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
}
.pizza-card{
  flex:0 0 auto; scroll-snap-align:start; width:112px; display:flex; flex-direction:column; gap:6px;
  border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface);
  overflow:hidden; cursor:pointer; padding:0 0 10px; text-align:left; color:inherit; font-family:inherit;
}

.pizza-card-photo{ width:100%; aspect-ratio:1/1; overflow:hidden; background:var(--surface-2); line-height:0; }

.ftr p{ font-size:0.74rem; line-height:1.6; color:var(--text-faint); }
.ftr .ftr-brand{ margin-top:12px; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); font-weight:700; }

/* ===== Filter sheet ===== */
.overlay{
  position:fixed; inset:0; background:rgba(10,8,5,0.55); backdrop-filter:blur(2px); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.show{ opacity:1; pointer-events:auto; }

.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:640px; margin:0 auto;
  background:var(--paper); border-top:1px solid var(--border-strong);
  border-radius:22px 22px 0 0; box-shadow:var(--shadow);
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:85vh; display:flex; flex-direction:column;
}
@media (prefers-color-scheme: dark){ .sheet{ background:var(--ink); } }
:root[data-theme="dark"] .sheet{ background:var(--ink); }
:root[data-theme="light"] .sheet{ background:var(--surface); }
.sheet.show{ transform:translateY(0); }

.sheet-hdr{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px 6px; }
.sheet-hdr h2{ font-size:1.3rem; font-weight:600; }
.sheet-hdr p{ font-size:0.8rem; color:var(--text-muted); margin-top:4px; }
.sheet-close{ background:var(--surface-2); border:none; color:var(--text-muted); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
.sheet-close .icon{ width:16px; height:16px; }
.sheet-close:hover{ color:var(--text); }

.allergen-grid{ padding:14px 20px 6px; display:grid; grid-template-columns:repeat(2,1fr); gap:8px; overflow-y:auto; }
.allergen-opt{
  display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:var(--radius-s);
  padding:10px 11px; cursor:pointer; background:var(--surface); transition:border-color .15s,background .15s;
}
.allergen-opt .dish-chip-icon{ background:var(--surface-2); }
.allergen-opt span{ font-size:0.82rem; font-weight:600; }
.allergen-opt[data-active="true"]{ border-color:var(--brick); background:var(--brick-soft); }
.allergen-opt[data-active="true"] .dish-chip-icon{ background:var(--brick); color:#fff; }
.allergen-opt input{ position:absolute; opacity:0; pointer-events:none; }

.sheet-toggle{ margin:14px 20px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 13px; border:1px solid var(--border); border-radius:var(--radius-s); }
.sheet-toggle span{ font-size:0.82rem; font-weight:600; }
.switch{ position:relative; width:42px; height:24px; flex:none; }
.switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.switch-track{ position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:999px; transition:background .15s; }
.switch-thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--text-muted); transition:transform .18s,background .18s; }
.switch input:checked ~ .switch-track{ background:var(--accent); border-color:var(--accent); }
.switch input:checked ~ .switch-thumb{ transform:translateX(18px); background:var(--accent-ink); }
.switch input:focus-visible ~ .switch-track{ box-shadow:var(--focus); }

.sheet-actions{ display:flex; gap:10px; padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 18px); margin-top:6px; }
.btn{ flex:1; border-radius:999px; padding:13px 16px; font-size:0.88rem; font-weight:800; letter-spacing:0.02em; cursor:pointer; border:1px solid var(--border-strong); }
.btn-ghost{ background:transparent; color:var(--text-muted); }
.btn-ghost:hover{ color:var(--text); border-color:var(--text-muted); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn:focus-visible{ outline:none; box-shadow:var(--focus); }

@media (min-width:520px){
  .allergen-grid{ grid-template-columns:repeat(3,1fr); }
}

A AI 3 POMODORI": "burrata-ai-3-pomodori.jpg", "CARPACCIO DI BRESAOLA & TARTUFO": "carpaccio-di-bresaola-tartufo.jpg", "LA NORMA GRATIN": "la-norma-gratin.jpg", "NORDICA": "nordica.jpg", "LA \"21\"": "la-21.jpg", "TONNO & CIPOLLA": "tonno-cipolla.jpg", "BOSCAIOLA": "boscaiola.jpg", "VEGETARIANA": "vegetariana.jpg"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('menu-data').textContent);
var ICON_MAP = {
  gluten:'ic-gluten', crustaceans:'ic-crustaceans', eggs:'ic-eggs', fish:'ic-fish',
  peanuts:'ic-peanuts', soy:'ic-soy', milk:'ic-milk', nuts:'ic-nuts',
  celery:'ic-celery', mustard:'ic-mustard', sesame:'ic-sesame',
  sulphites:'ic-sulphites', lupin:'ic-lupin', molluscs:'ic-molluscs'
};

var state = {
  lang: (function(){
    var saved = null;
    try{ var q=(new URLSearchParams(location.search).get('lang')||'').toUpperCase(); if(q && DATA.langs.indexOf(q)!==-1) return q; }catch(e){}
    try{ saved = localStorage.getItem('al21_lang'); }catch(e){}
    if(saved && DATA.langs.indexOf(saved) !== -1) return saved;
    var nav = (navigator.language||'IT').slice(0,2).toUpperCase();
    return DATA.langs.indexOf(nav) !== -1 ? nav : 'IT';
  })(),
  query: '',
  excluded: [],
  hideMode: false,
  openDish: null,
  openSections: {},
  openDrinkCats: {}
};

function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'text') e.textContent = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function iconEl(id, cls){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('class', 'icon' + (cls?(' '+cls):''));
  var use = document.createElementNS(ns,'use');
  use.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+id);
  use.setAttribute('href','#'+id);
  svg.appendChild(use);
  return svg;
}
function ui(){ return DATA.ui[state.lang]; }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function slug(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function dishMatchesQuery(d, q){
  if(!q) return true;
  var hay = norm(d.name + ' ' + d.ingredients + ' ' + d.allergens);
  return hay.indexOf(norm(q)) !== -1;
}
function dishFlags(d){
  return state.excluded.filter(function(a){ return d.tagsAllergens.indexOf(a) !== -1; });
}
function dishTraceFlags(d){
  var contains = dishFlags(d);
  return state.excluded.filter(function(a){
    return d.tagsTraces.indexOf(a) !== -1 && contains.indexOf(a) === -1;
  });
}

function render(){
  document.documentElement.setAttribute('lang', state.lang.toLowerCase());
  renderHeader();
  renderMain();
  renderSheet();
}

function renderHeader(){
  var u = ui();
  document.getElementById('brand-tag').textContent = u.tagline;
  var search = document.getElementById('search');
  search.placeholder = u.searchPlaceholder;
  search.value = state.query;
  document.getElementById('search-clear').classList.toggle('show', !!state.query);
  document.getElementById('filter-label').textContent = u.filterButton;

  var langbar = document.getElementById('langbar');
  langbar.innerHTML = '';
  DATA.langs.forEach(function(l){
    var btn = el('button',{class:'lang-btn','aria-pressed': (l===state.lang)?'true':'false','data-lang':l,text:l});
    btn.addEventListener('click', function(){
      state.lang = l;
      try{ localStorage.setItem('al21_lang', l); }catch(e){}
      state.query=''; state.openDish=null;
      render();
    });
    langbar.appendChild(btn);
  });

  var count = document.getElementById('filter-count');
  if(state.excluded.length){ count.textContent = state.excluded.length; count.classList.add('show'); }
  else { count.classList.remove('show'); }
}

function buildDetailBlock(d){
  var u = ui();
  var detail = el('div',{class:'dish-detail'});
  function block(cls, label, text){
    if(!text) return;
    var b = el('div',{class:'detail-block '+cls});
    b.appendChild(el('label',{text:label}));
    b.appendChild(el('p',{text:text}));
    detail.appendChild(b);
  }
  block('ingredients', u.ingredientsLabel, d.ingredients);
  block('allergens', u.allergensLabel, d.allergens);
  block('traces', u.tracesLabel, d.traces);
  block('cross', u.crossLabel, d.cross);
  return detail;
}

function buildCarouselSection(dishes, sectionKey){
  var track = el('div',{class:'pizza-carousel'});
  var openDish = null;

  dishes.forEach(function(d){
    var id = sectionKey + '__' + slug(d.name);
    var open = state.openDish === id;
    if(open) openDish = d;

    var card = el('button',{class:'pizza-card',type:'button','data-open':open?'true':'false'});
    var imgB64 = DATA.images[d.name];
    if(imgB64){
      var figure = el('div',{class:'pizza-card-photo'});
      var img = el('img',{alt:d.name, loading:'lazy'});
      img.src = 'img/' + imgB64;
      figure.appendChild(img);
      card.appendChild(figure);
    }
    card.appendChild(el('span',{class:'pizza-card-name',text:d.name}));
    if(d.price) card.appendChild(el('span',{class:'pizza-card-price',text:d.price}));
    card.addEventListener('click', function(){
      state.openDish = open ? null : id;
      render();
    });
    track.appendChild(card);
  });

  var wrap = el('div',{class:'pizza-carousel-wrap'});
  wrap.appendChild(track);

  if(openDish){
    var detailWrap = el('div',{class:'pizza-carousel-detail'});
    detailWrap.appendChild(buildDetailBlock(openDish));
    wrap.appendChild(detailWrap);
  }
  return wrap;
}

function buildDishNode(d, sectionKey){
  var u = ui();
  var flags = dishFlags(d);
  var traceFlags = dishTraceFlags(d);
  var isFlagged = flags.length > 0 || traceFlags.length > 0;
  var id = sectionKey + '__' + slug(d.name);
  var open = state.openDish === id;

  var wrap = el('div',{class:'dish','data-open': open?'true':'false','data-flagged': isFlagged?'true':'false'});

  var chips = el('div',{class:'dish-chips'});
  d.tagsAllergens.forEach(function(a){
    var iconId = ICON_MAP[a];
    if(!iconId) return;
    var warn = state.excluded.indexOf(a) !== -1;
    var c = el('span',{class:'dish-chip-icon'+(warn?' warn':''), title: DATA.allergenLabels[a][state.lang]});
    c.appendChild(iconEl(iconId));
    chips.appendChild(c);
  });

  var row = el('button',{class:'dish-row',type:'button','aria-expanded':open?'true':'false'});
  var titleWrap = el('span',{class:'dish-title'});
  titleWrap.appendChild(el('span',{class:'dish-name',text:d.name}));
  if(d.price) titleWrap.appendChild(el('span',{class:'dish-price',text:d.price}));
  row.appendChild(titleWrap);
  row.appendChild(chips);
  if(d.glutenfree) row.appendChild(el('span',{class:'dish-gf',text:u.glutenfreeBadge}));
  row.appendChild(iconEl('ic-chevron','dish-chevron'));
  row.addEventListener('click', function(){
    state.openDish = open ? null : id;
    render();
    if(!open){
      requestAnimationFrame(function(){
        var node = document.getElementById(id);
        if(node) node.scrollIntoView({block:'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth'});
      });
    }
  });
  wrap.id = id;

  var imgB64 = DATA.images[d.name];
  if(imgB64){
    var figure = el('div',{class:'dish-photo'});
    var img = el('img',{alt:d.name, loading:'lazy'});
    img.src = 'img/' + imgB64;
    figure.appendChild(img);
    wrap.appendChild(figure);
  }

  wrap.appendChild(row);

  if(flags.length){
    var wl = el('div',{class:'dish-warnline'});
    wl.appendChild(iconEl('ic-warn'));
    var names = flags.map(function(a){ return DATA.allergenLabels[a][state.lang]; }).join(', ');
    wl.appendChild(el('span',{text: u.containsLabel + ': ' + names}));
    wrap.appendChild(wl);
  }
  if(traceFlags.length){
    var wlt = el('div',{class:'dish-warnline trace'});
    wlt.appendChild(iconEl('ic-warn'));
    var tnames = traceFlags.map(function(a){ return DATA.allergenLabels[a][state.lang]; }).join(', ');
    wlt.appendChild(el('span',{text: u.tracesLabel + ': ' + tnames}));
    wrap.appendChild(wlt);
  }

  var body = el('div',{class:'dish-body'});
  var inner = el('div',{class:'dish-body-inner'});
  inner.appendChild(buildDetailBlock(d));
  body.appendChild(inner);
  wrap.appendChild(body);

  return wrap;
}

function renderMain(){
  var u = ui();
  var main = document.getElementById('main');
  main.innerHTML = '';
  var sections = DATA.menu[state.lang];
  var totalShown = 0, totalHidden = 0;

  sections.forEach(function(sec, si){
    if(sec.type === 'drinks'){
      var visibleGroups = [];
      var itemCount = 0;
      sec.groups.forEach(function(g){
        var items = g.items.filter(function(it){ return dishMatchesQuery({name:it.name, ingredients:'', allergens:''}, state.query); });
        if(items.length){ visibleGroups.push({category:g.category, items:items}); itemCount += items.length; }
      });
      if(itemCount === 0) return;
      totalShown += itemCount;

      var isOpenD = state.query ? true : !!state.openSections[si];
      var secElD = el('div',{class:'section','data-open': isOpenD?'true':'false'});
      var headD = el('button',{class:'section-head',type:'button','aria-expanded':isOpenD?'true':'false'});
      headD.appendChild(el('h2',{class:'section-title',text:sec.title}));
      headD.appendChild(el('span',{class:'section-count',text:itemCount}));
      headD.appendChild(iconEl('ic-chevron','section-chevron'));
      headD.addEventListener('click', function(){
        state.openSections[si] = !isOpenD;
        render();
      });
      secElD.appendChild(headD);

      var bodyD = el('div',{class:'section-body'});
      var innerD = el('div',{class:'section-body-inner'});
      if(sec.note){ innerD.appendChild(el('p',{class:'section-note',text:sec.note})); }

      var drinksWrap = el('div',{class:'drinks-list'});
      visibleGroups.forEach(function(g){
        var catKey = g.category;
        var catOpen = state.query ? true : !!state.openDrinkCats[catKey];

        var catEl = el('div',{class:'drink-cat','data-open': catOpen?'true':'false'});
        var catHead = el('button',{class:'drinks-category',type:'button','aria-expanded':catOpen?'true':'false'});
        catHead.appendChild(el('span',{class:'drinks-category-name',text:g.category}));
        catHead.appendChild(el('span',{class:'drinks-category-count',text:g.items.length}));
        catHead.appendChild(iconEl('ic-chevron','drinks-category-chevron'));
        catHead.addEventListener('click', function(){
          state.openDrinkCats[catKey] = !catOpen;
          render();
        });
        catEl.appendChild(catHead);

        var catBody = el('div',{class:'drink-cat-body'});
        var catInner = el('div',{class:'drink-cat-body-inner'});
        g.items.forEach(function(it){
          var row = el('div',{class:'drink-row'});
          row.appendChild(el('span',{class:'drink-name',text:it.name}));
          if(it.prices){
            var priceGroup = el('span',{class:'drink-price-group'});
            it.prices.forEach(function(p){
              var priceItem = el('span',{class:'drink-price-item'});
              priceItem.appendChild(el('span',{class:'drink-price-label',text:p.label}));
              priceItem.appendChild(document.createTextNode(p.price));
              priceGroup.appendChild(priceItem);
            });
            row.appendChild(priceGroup);
          } else {
            row.appendChild(el('span',{class:'drink-price',text:it.price}));
          }
          catInner.appendChild(row);
        });
        catBody.appendChild(catInner);
        catEl.appendChild(catBody);
        drinksWrap.appendChild(catEl);
      });
      innerD.appendChild(drinksWrap);
      bodyD.appendChild(innerD);
      secElD.appendChild(bodyD);
      main.appendChild(secElD);
      return;
    }

    var visibleDishes = [];
    var hiddenCount = 0;
    sec.dishes.forEach(function(d){
      var matches = dishMatchesQuery(d, state.query);
      if(!matches) return;
      var flagged = dishFlags(d).length > 0 || dishTraceFlags(d).length > 0;
      if(flagged && state.hideMode){ hiddenCount++; return; }
      visibleDishes.push(d);
    });
    if(visibleDishes.length === 0 && hiddenCount === 0) return;
    totalShown += visibleDishes.length;
    totalHidden += hiddenCount;

    var isOpen = state.query ? true : !!state.openSections[si];

    var secEl = el('div',{class:'section','data-open': isOpen?'true':'false'});
    var head = el('button',{class:'section-head',type:'button','aria-expanded':isOpen?'true':'false'});
    head.appendChild(el('h2',{class:'section-title',text:sec.title}));
    head.appendChild(el('span',{class:'section-count',text:visibleDishes.length}));
    head.appendChild(iconEl('ic-chevron','section-chevron'));
    head.addEventListener('click', function(){
      state.openSections[si] = !isOpen;
      render();
    });
    secEl.appendChild(head);

    var body = el('div',{class:'section-body'});
    var inner = el('div',{class:'section-body-inner'});
    if(sec.note){ inner.appendChild(el('p',{class:'section-note',text:sec.note})); }

    if(sec.layout === 'carousel'){
      inner.appendChild(buildCarouselSection(visibleDishes, 's'+si));
    } else {
      var list = el('div',{class:'dishlist'});
      visibleDishes.forEach(function(d){
        list.appendChild(buildDishNode(d, 's'+si));
      });
      inner.appendChild(list);
    }

    if(hiddenCount > 0){
      inner.appendChild(el('p',{class:'hidden-note', text:'· ' + hiddenCount + ' ' + u.hiddenNotice}));
    }
    body.appendChild(inner);
    secEl.appendChild(body);
    main.appendChild(secEl);
  });

  if(totalShown === 0){
    var empty = el('div',{class:'empty'});
    empty.appendChild(iconEl('ic-search'));
    empty.appendChild(el('p',{text:u.noResults}));
    main.appendChild(empty);
  }

  var metaEl = document.getElementById('results-meta');
  var label = totalShown === 1 ? u.dishSingular : u.dishPlural;
  metaEl.textContent = totalShown + ' ' + label + (totalHidden ? ' · ' + totalHidden + ' ' + u.hiddenNotice : '');

  document.getElementById('ftr-note').textContent = u.footerNote;
}

function renderSheet(){
  var u = ui();
  document.getElementById('sheet-title').textContent = u.filterTitle;
  document.getElementById('sheet-hint').textContent = u.filterHint;
  document.getElementById('hide-toggle-label').textContent = u.hideToggle;
  document.getElementById('reset-btn').textContent = u.resetFilters;
  document.getElementById('apply-btn').textContent = u.apply;
  document.getElementById('hide-switch').checked = state.hideMode;

  var grid = document.getElementById('allergen-grid');
  grid.innerHTML = '';
  DATA.allergenOrder.forEach(function(a){
    var active = state.excluded.indexOf(a) !== -1;
    var opt = el('label',{class:'allergen-opt','data-active':active?'true':'false'});
    var cb = el('input',{type:'checkbox'});
    cb.checked = active;
    cb.addEventListener('change', function(){
      var i = state.excluded.indexOf(a);
      if(cb.checked && i === -1) state.excluded.push(a);
      if(!cb.checked && i !== -1) state.excluded.splice(i,1);
      renderSheet();
    });
    var iconWrap = el('span',{class:'dish-chip-icon'});
    iconWrap.appendChild(iconEl(ICON_MAP[a]));
    opt.appendChild(cb);
    opt.appendChild(iconWrap);
    opt.appendChild(el('span',{text: DATA.allergenLabels[a][state.lang]}));
    grid.appendChild(opt);
  });
}

function openSheet(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet(applyChanges){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.body.style.overflow = '';
  render();
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('search').addEventListener('input', function(e){
    state.query = e.target.value; renderMain();
    document.getElementById('search-clear').classList.toggle('show', !!state.query);
  });
  document.getElementById('search-clear').addEventListener('click', function(){
    state.query=''; document.getElementById('search').value=''; renderMain();
    document.getElementById('search-clear').classList.remove('show');
    document.getElementById('search').focus();
  });
  document.getElementById('filter-open').addEventListener('click', function(){ renderSheet(); openSheet(); });
  document.getElementById('sheet-close').addEventListener('click', function(){ closeSheet(); });
  document.getElementById('overlay').addEventListener('click', function(){ closeSheet(); });
  document.getElementById('reset-btn').addEventListener('click', function(){
    state.excluded = []; state.hideMode = false; renderSheet();
  });
  document.getElementById('apply-btn').addEventListener('click', function(){ closeSheet(); });
  document.getElementById('hide-switch').addEventListener('change', function(e){
    state.hideMode = e.target.checked;
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeSheet();
  });
  render();
});
})();

</script>
